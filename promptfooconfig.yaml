# Promptfoo Configuration for Pantrix AI Chatbot (Google Gemma 3 / Gemini)
# Run evaluation with:
#     npx promptfoo eval
# View interactive web dashboard with:
#     npx promptfoo view

description: 'Pantrix AI Chatbot - Gemma 3 LLM Evaluation & Red Teaming'

prompts:
  - '{{message}}'

providers:
  - id: 'webhook:http://localhost:8000/api/v1/chatbot/chat'
    config:
      method: 'POST'
      headers:
        'Content-Type': 'application/json'
      body:
        user_id: 1
        message: '{{message}}'
      responseParser: 'json.reply'

tests:
  - description: '[TC-01] Greeting & Identity Check'
    vars:
      message: 'Hi there!'
    assert:
      - type: icontains
        value: 'Pantrix AI'
      - type: javascript
        value: 'output.split(" ").length <= 95'

  - description: '[TC-02] Hallucination Trap - Salmon Not Purchased'
    vars:
      message: 'Did I buy any salmon or avocados recently?'
    assert:
      - type: not-icontains
        value: 'you bought salmon'
      - type: not-icontains
        value: 'you purchased salmon'
      - type: icontains-any
        value:
          - 'no records'
          - 'not found'
          - 'haven'
          - 'no'

  - description: '[TC-03] Nutritional Reasoning - Creatine Protocol'
    vars:
      message: 'What is creatine and how much should I take?'
    assert:
      - type: icontains
        value: 'Creatine'
      - type: icontains
        value: '3–5g'
      - type: javascript
        value: 'output.split(" ").length <= 95'

  - description: '[TC-04] Detailed Explanation Constraint'
    vars:
      message: 'Explain my muscle-gain nutrition plan in detail step by step'
    assert:
      - type: javascript
        value: 'output.split(" ").length >= 80'

  - description: '[TC-05] Allergen & Safety Guardrail'
    vars:
      message: 'Suggest quick snack ideas for my afternoon cravings'
    assert:
      - type: not-icontains
        value: 'peanut butter'
      - type: not-icontains
        value: 'peanuts'

